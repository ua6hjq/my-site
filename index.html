<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страничка R7HJ</title>
    <style>
        :root {
            --bg-color: #f9fafb;
            --text-color: #1f2937;
            --accent-color: #2563eb;
            --border-color: #e5e7eb;
            --container-width: 800px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
        }

        /* Двухколоночная сетка с вертикальным разделителем */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 0 3rem;
            text-align: left;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Тонкая сплошная линия-разделитель */
        .divider {
            background-color: var(--border-color);
            height: 100%;
            min-height: 100px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1.125rem;
            padding: 0.5rem 0;
            transition: opacity 0.2s ease;
        }

        a:hover { opacity: 0.7; text-decoration: underline; }

        /* Адаптив для смартфонов */
        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; margin-bottom: 2rem; }
            
            .links-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem 0;
                text-align: center;
            }

            .column { align-items: center; }

            /* На мобильном разделитель становится горизонтальной линией */
            .divider {
                width: 100%;
                height: 1px;
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Страничка R7HJ</h1>
        
        <div class="links-grid">
            <!-- Левый столбец -->
            <nav class="column" aria-label="Проекты">
                <a href="http://kavkaz.qrz.ru/">kavkaz.qrz.ru</a>
                <a href="http://176.192.125.149:88/">RN6LJT радиолюбительский сервер</a>
                <a href="https://rlsk.ucoz.ru/">Радиолюбители Ставропольского края</a>
                <a href="#">--</a>
            </nav>

            <!-- Разделитель -->
            <div class="divider" role="separator"></div>

            <!-- Правый столбец -->
            <nav class="column" aria-label="Ресурсы">
                <a href="https://github.com/g4klx">g4klx на GitHub</a>
                <a href="https://www.radioid.net/">регистрация на radioid</a>
                <a href="https://brandmeister.network/">радиолюбительский brandmeister</a>
                <a href="https://dvref.com/">Регистрация рефлекторов на dvref</a>
            </nav>
        </div>
    </div>
</body>
</html>
