<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 100'><text y='.9em' font-size='90'>📻</text></svg>">
    <title>R7HJ</title>
    <style>
        :root {
            /* Новая темная цветовая схема в тон карте */
            --bg-color: #0b1320; 
            --text-color: #cbd5e1;
            --accent-color: #60a5fa;
            --border-color: #1e293b;
            --container-width: 800px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            /* Легкий градиент для глубины космоса */
            background-image: radial-gradient(circle at center, #1e293b 0%, #0b1320 100%);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
            color: #f8fafc;
        }

        /* Двухколоночная сетка с вертикальным разделителем */
        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 0 3rem;
            text-align: left;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Тонкая сплошная линия-разделитель */
        .divider {
            background-color: var(--border-color);
            height: 100%;
            min-height: 100px;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1.125rem;
            padding: 0.5rem 0;
            transition: all 0.2s ease;
        }

        a:hover { 
            color: #93c5fd; 
            text-decoration: underline; 
        }

        /* Стили для картинки, чтобы она гармонично вписывалась */
        .map-container {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
        }

        .map-image {
            width: 100%;
            max-width: 700px;
            height: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Адаптив для смартфонов */
        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; margin-bottom: 2rem; }
            
            .links-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem 0;
                text-align: center;
            }

            .column { align-items: center; }

            /* На мобильном разделитель становится горизонтальной линией */
            .divider {
                width: 100%;
                height: 1px;
                min-height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Страничка R7HJ на GitHub</h1>
        
        <div class="links-grid">
            <!-- Левый столбец -->
            <nav class="column" aria-label="Проекты">
                <a href="http://kavkaz.qrz.ru/">Сайт kavkaz.qrz.ru</a>
                <a href="https://www.qrz.com/db/R7HJ">Страничка и лог r7hj/0 на qrz.com</a>
                <a href="http://176.192.125.149:88/">RN6LJT радиолюбительский сервер</a>
                <!-- a href="https://rlsk.ucoz.ru/">Радиолюбители Ставропольского края</a -->
            </nav>

            <!-- Разделитель -->
            <div class="divider" role="separator"></div>

            <!-- Правый столбец -->
            <nav class="column" aria-label="Ресурсы">
                <!-- a href="https://github.com/g4klx">Jonathan Naylor (g4klx) на GitHub</a -->
                <a href="https://www.radioid.net/">регистрация на radioid</a>
                <a href="https://brandmeister.network/">радиолюбительский brandmeister</a>
                <a href="https://dvref.com/">регистрация рефлекторов на dvref</a>
            </nav>
        </div>
        
        <!-- Обертка для картинки -->
        <div class="map-container">
            <img src="map.jpg" alt="Карта активности R7HJ" class="map-image">
        </div>

    </div>
</body>
</html>
